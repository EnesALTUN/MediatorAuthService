services:
  mediatorauthservice.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings:Default=${SQL_CONNECTION_STRING}
      - ElasticSearch:Uri=${ELASTIC_URI}
      - ElasticSearch:Username=${ELASTIC_USERNAME:-}
      - ElasticSearch:Password=${ELASTIC_PASSWORD:-}
      - JwtTokenOption:SecurityKey=${JWT_SECURITY_KEY}
      - MediatR:LicenseKey=${MEDIATR_LICENSE_KEY}
      - Seed:AdminEmail=${SEED_ADMIN_EMAIL:-}
      - Seed:AdminPassword=${SEED_ADMIN_PASSWORD:-}
      - Cors:AllowedOrigins:0=${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      # TLS is expected to be terminated by a reverse proxy in front of the container.
      - HttpsRedirection:Enabled=false
    ports:
      - "5216:8080"
    networks:
      - net_backendservices
      - sql_db
      - elastic_net
    depends_on:
      s_sqlserver:
        condition: service_healthy
      s_elasticsearch:
        condition: service_healthy
    restart: on-failure

  s_sqlserver:
    ports:
      - "127.0.0.1:1453:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD}
    volumes:
      - mediator_sqlserver:/var/opt/mssql
    networks:
      - sql_db
    healthcheck:
      # Newer images ship mssql-tools18, older ones mssql-tools.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Development-only setup: security is disabled, so the ports are bound to localhost.
  s_elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - mediator_elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - elastic_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  s_kibana:
    image: docker.elastic.co/kibana/kibana:9.0.0
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTIC_URI}
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - elastic_net
    depends_on:
      s_elasticsearch:
        condition: service_healthy

networks:
  net_backendservices:
    driver: bridge
    external: true
  sql_db:
    driver: bridge
    external: true
  elastic_net:
    driver: bridge

volumes:
  mediator_sqlserver:
  mediator_elasticsearch_data:
